name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '24'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: ./build.sh ui
      - run: ./build.sh test
      - name: Integration tests (Docker)
        run: ./build.sh itest

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - run: ./build.sh ui
      - name: Native desktop build
        run: |
          VERSION=$(git describe --tags --always)
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 -ldflags "-s -w -X main.version=$VERSION" -o skiff-linux-${{ matrix.arch }}-desktop .
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o skiff-linux-${{ matrix.arch }} .
      - uses: actions/upload-artifact@v4
        with: { name: 'linux-${{ matrix.arch }}', path: 'skiff-linux-*' }

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: ./build.sh ui
      - name: Native desktop build (universal)
        run: |
          VERSION=$(git describe --tags --always)
          for arch in arm64 amd64; do
            CGO_ENABLED=1 GOARCH=$arch go build -trimpath -tags desktop,production -ldflags "-s -w -X main.version=$VERSION" -o skiff-$arch .
          done
          lipo -create -output skiff skiff-arm64 skiff-amd64
          ./build/darwin/bundle.sh skiff Skiff.app "${VERSION#v}"
          ditto -c -k --keepParent Skiff.app skiff-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: skiff-macos-universal.zip }

  windows:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: ./build.sh ui
      - name: Cross-compile Windows (WebView2, no CGO)
        run: |
          VERSION=$(git describe --tags --always)
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -tags desktop,production -ldflags "-s -w -X main.version=$VERSION" -o skiff-windows-$arch.exe .
          done
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'skiff-windows-*.exe' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
