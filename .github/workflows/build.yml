name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '24'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
        with: { version: 12 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: ./build.sh ui
      - run: ./build.sh test
      - name: Integration tests (Docker)
        run: ./build.sh itest

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
        with: { version: 12 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      # the native Linux window is analysed too: it needs the GTK/WebKit headers
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Known vulnerabilities (Go, every system)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          govulncheck -tags desktop,production,webkit2_41 ./...
          GOOS=windows govulncheck -tags desktop,production ./...
          GOOS=darwin govulncheck ./...
      - name: Known vulnerabilities (interface)
        run: cd frontend && pnpm install --frozen-lockfile && pnpm audit --prod
      - name: Fuzzing the parsers of what servers send
        run: |
          for t in "FuzzParseURL ./internal/config/" "FuzzParseAuthorized ./internal/keys/" "FuzzListingLines ./internal/vfs/ftpfs/" \
                   "FuzzListings ./internal/vfs/scpfs/" "FuzzSafeName ./internal/vfs/" "FuzzLines ./internal/sshconfig/" \
                   "FuzzTokenize ./internal/script/" "FuzzServerOutputs ./internal/core/"; do
            set -- $t
            go test -run '^$' -fuzz "^$1\$" -fuzztime 30s "$2"
          done

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
        with: { version: 12 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config squashfs-tools
      - run: ./build.sh ui
      - name: Native desktop build
        run: |
          VERSION=$(git describe --tags --always)
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 -ldflags "-s -w -X main.version=$VERSION" -o skiff-linux-${{ matrix.arch }}-desktop .
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o skiff-linux-${{ matrix.arch }} .
      - name: Debian package and AppImage
        run: ./build.sh deb appimage
      - uses: actions/upload-artifact@v7
        with: { name: 'linux-${{ matrix.arch }}', path: "skiff-linux-*\ndist/*.deb\ndist/*.AppImage" }

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
        with: { version: 12 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Disk image (universal Skiff.app, native window)
        run: ./build.sh dmg
      - name: Installed by install.sh, signed ad hoc, starts
        run: |
          SKIFF_DMG="$(ls dist/*.dmg)" sh install.sh
          codesign --verify --deep --strict /Applications/Skiff.app
          /Applications/Skiff.app/Contents/MacOS/skiff version
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: 'dist/*.dmg' }

  windows:
    needs: test
    runs-on: ubuntu-24.04
    env:
      # Authenticode signing by SignPath (SignPath Foundation certificate), for
      # the releases only, once the project is set up there (see
      # docs/19-developpement.md): the programs first, then the installers
      # made from them
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ env.GO_VERSION }}' }
      - uses: pnpm/action-setup@v6
        with: { version: 12 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: ./build.sh ui
      - name: Cross-compile Windows (WebView2, no CGO)
        run: |
          VERSION=$(git describe --tags --always)
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -trimpath -tags desktop,production -ldflags "-s -w -X main.version=$VERSION" -o skiff-windows-$arch.exe .
          done
      - id: exe
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with: { name: windows-exe-unsigned, path: 'skiff-windows-*.exe' }
      - if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG || 'skiff' }}"
          signing-policy-slug: "${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}"
          artifact-configuration-slug: windows-exe
          github-artifact-id: '${{ steps.exe.outputs.artifact-id }}'
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
      - if: env.SIGN == 'true'
        run: mv -f signed-exe/skiff-windows-*.exe .
      - name: Installers (NSIS)
        run: SKIFF_WINDOWS_EXES=. ./build.sh setup-windows
      - id: setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with: { name: windows-setup-unsigned, path: 'dist/skiff-setup-*.exe' }
      - if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: "${{ vars.SIGNPATH_PROJECT_SLUG || 'skiff' }}"
          signing-policy-slug: "${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}"
          artifact-configuration-slug: windows-setup
          github-artifact-id: '${{ steps.setup.outputs.artifact-id }}'
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
      - if: env.SIGN == 'true'
        run: mv -f signed-setup/skiff-setup-*.exe dist/
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: "skiff-windows-*.exe\ndist/skiff-setup-*.exe" }

  # the MSIX packages of the Microsoft Store (the Store signs them): an
  # artifact of the run, to upload to Partner Center, not part of the release
  msix:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: windows, path: win }
      - name: The installer installs silently, Skiff starts
        shell: pwsh
        run: |
          $setup = Get-ChildItem win/dist/skiff-setup-*-windows-amd64.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          & "$env:LOCALAPPDATA\Programs\Skiff\skiff.exe" version
          if ($LASTEXITCODE) { throw "skiff version failed ($LASTEXITCODE)" }
      - name: MSIX bundle (x64 and arm64)
        shell: pwsh
        run: |
          $d = git describe --tags --always
          $v = if ($d -match '^v?(\d+\.\d+(\.\d+)?)') { $Matches[1] } else { '0.1.0' }
          ./build/windows/msix.ps1 -Version $v -ExeDir win -OutDir dist `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'Laterna.Skiff' }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=Laterna' }}" `
            -PublisherName "${{ vars.MSIX_PUBLISHER_NAME || 'Laterna' }}"
      - uses: actions/upload-artifact@v7
        with: { name: store-msix, path: 'dist/*.msixbundle' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Gather the files (the packages come in dist/)
        run: |
          mkdir release
          # one folder per artifact: only the published ones, not the
          # unsigned programs of the signing nor the package of the Store
          for a in artifacts/linux-* artifacts/macos artifacts/windows; do
            find "$a" -type f -exec mv -t release {} +
          done
          cd release && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
